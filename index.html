<!DOCTYPE html>
<!--
  GUIDA ORDINI CLIENTE
  ─────────────────────────────────────────────────────────────
  Come pubblicarlo:
  1. Crea una repository GitHub e caricala con questi 2 file nella STESSA cartella (radice):
       index.html   ← questo file
       preset.csv   ← il file dei preset (te lo genera l'app con "Esporta tutto")
  2. Settings → Pages → Source: "Deploy from a branch" → cartella root → Save.
  3. Apri l'indirizzo https://TUO-UTENTE.github.io/NOME-REPO/
  4. Per pubblicare gli aggiornamenti da dentro l'app: Impostazioni → Preset e GitHub
     (serve un token "fine-grained" con permesso Contents: Read & write — guida inclusa nell'app).
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guida Ordini Cliente</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%2304A29C'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{
  --ink:#23282d; --ink2:#6a7178; --line:#e3e6ea; --bg:#f2f3f5; --card:#fff;
  --teal:#04A29C; --teal-d:#038782; --dng:#c0392b;
  --fd:'Space Grotesk',sans-serif; --fb:'IBM Plex Sans',sans-serif; --fm:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font:15px/1.5 var(--fb);color:var(--ink);background:var(--bg)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(35,40,45,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(35,40,45,.045) 1px,transparent 1px);
  background-size:28px 28px}
body::after{content:'';position:fixed;top:-240px;right:-180px;width:600px;height:600px;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,rgba(4,162,156,.10),transparent 70%)}
::selection{background:rgba(4,162,156,.25)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid rgba(4,162,156,.55);outline-offset:2px}
.mono{font-family:var(--fm)} .mut{color:var(--ink2);font-size:12.5px} .sp{flex:1}
.fade{animation:fadeup .35s cubic-bezier(.2,.7,.3,1)}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── pulsanti ─────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:9px;
  border:1px solid transparent;font:600 14px var(--fb);transition:.16s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pr{background:var(--ink);color:#fff}
.btn-pr:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,24,28,.22)}
.btn-acc{background:var(--teal);color:#fff}
.btn-acc:not(:disabled):hover{background:var(--teal-d);transform:translateY(-1px);box-shadow:0 6px 18px rgba(4,162,156,.35)}
.btn-gh{background:#fff;border-color:#d8dce1;color:var(--ink)}
.btn-gh:hover{border-color:var(--ink)}
.btn-dng{background:#fff;border-color:#ecd7d4;color:var(--dng)}
.btn-dng:hover{background:#fdf1ef}
.btn.big{padding:13px 22px;font-size:15px} .btn.xl{padding:16px 28px;font-size:16px;border-radius:11px}
.btn.small{padding:7px 12px;font-size:13px}
.linkbtn{background:none;border:none;display:inline-flex;gap:6px;align-items:center;font:600 13.5px var(--fb);color:var(--ink2);padding:6px 4px}
.linkbtn:hover{color:var(--ink)} .linkbtn.dang{color:var(--dng)}
.ibtn{width:32px;height:32px;border-radius:8px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);transition:.14s;font-size:14px}
.ibtn:hover{background:#eef0f2;color:var(--ink)} .ibtn.dang:hover{background:#fdeceb;color:var(--dng)} .ibtn:disabled{opacity:.25}
input[type=checkbox]{accent-color:var(--teal);width:16px;height:16px}

/* ── input ────────────────────────────────── */
.inp{width:100%;padding:11px 14px;border-radius:9px;border:1px solid #d8dce1;background:#fff;font-size:14.5px;transition:.15s}
.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(4,162,156,.13)}
.inp-big{font-size:17px;padding:14px 16px;border-radius:11px}
label{font:600 12px var(--fb);color:var(--ink2);display:block;margin-bottom:6px;letter-spacing:.02em}
.frow{margin-bottom:12px} .frow2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ── card & layout ────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 1px 2px rgba(20,24,28,.05)}
.card.pad{padding:22px}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh;position:relative;z-index:1}
.side{background:#23282d;color:#b9bfc7;display:flex;flex-direction:column;padding:24px 16px 18px;position:sticky;top:0;height:100vh}
.brand-t{font:700 23px/1.15 var(--fd);color:#fff;letter-spacing:-.4px}
.brand-t span{color:var(--teal)}
.brand-k{font:500 10.5px var(--fm);letter-spacing:.22em;color:#7d858e;margin-bottom:8px;text-transform:uppercase}
.sidenav{display:flex;flex-direction:column;gap:4px;margin-top:34px}
.snav{display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:9px;border:none;background:transparent;
  color:#c3c9d0;font:600 14px var(--fb);text-align:left;transition:.15s}
.snav i{font-size:16px}
.snav:hover{background:rgba(255,255,255,.06);color:#fff}
.snav.on{background:rgba(4,162,156,.16);color:#fff;box-shadow:inset 2px 0 0 var(--teal)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:7px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.srow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#9aa1a9}
.dot{width:7px;height:7px;border-radius:50%;background:#7d858e;flex:none}
.dot.ok{background:var(--teal);animation:pulse 2.2s infinite}
.dot.err{background:#e0605a} .dot.nofile{background:#d9a13b}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(4,162,156,.5)}55%{box-shadow:0 0 0 5px rgba(4,162,156,0)}}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;position:sticky;top:0;z-index:5}
.tb-date{font:600 13px var(--fb);color:var(--ink2);text-transform:capitalize}
.tb-right{display:flex;gap:10px;align-items:center}
.opchip{display:flex;align-items:center;gap:9px;background:#f4f5f6;border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px}
.opchip.ghost{border-style:dashed;color:var(--ink2);font:600 13px var(--fb)}
.opav{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;
  font:700 12px var(--fd);flex:none}
.opav.big{width:52px;height:52px;font-size:18px}
.opname{font:600 13.5px var(--fb)}
.opcode{font:500 12px var(--fm);color:var(--teal-d);border-left:1px solid #d9dde2;padding-left:9px}
.content{padding:30px 34px;max-width:1080px;width:100%;margin:0 auto}
.crumb{font:700 11px var(--fd);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.phead{margin-bottom:22px} .phead h1{font:700 27px/1.2 var(--fd);letter-spacing:-.5px;margin-top:6px}

/* ── login ────────────────────────────────── */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(360px,470px) 1fr;position:relative;z-index:1}
.l-left{background:#23282d;color:#fff;padding:54px 50px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.l-left::after{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:26px 26px}
.l-left>*{position:relative;z-index:1}
.l-left .brand-t{font-size:40px}
.l-tag{margin-top:18px;color:#b9bfc7;font-size:15px;max-width:340px;line-height:1.65}
.l-steps{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.l-step{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);
  border-radius:999px;padding:7px 13px;font:600 12.5px var(--fb);color:#dfe3e7}
.l-step b{color:var(--teal);font-family:var(--fm)}
.l-date{font:700 17px var(--fd);text-transform:capitalize;margin-bottom:14px}
.l-code-demo{font-size:13px;color:#9aa1a9;line-height:1.7;border-left:2px solid var(--teal);padding-left:14px}
.l-code-demo b,.l-code-demo .mono{color:#e7eaee}
.l-right{display:flex;align-items:center;justify-content:center;padding:50px 40px}
.l-rwrap{width:min(640px,100%)}
.l-title{font:700 42px/1.1 var(--fd);letter-spacing:-1px;margin:8px 0 8px}
.l-sub{color:var(--ink2);margin-bottom:28px}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.optile{display:flex;gap:14px;align-items:center;padding:17px 18px;background:#fff;border:1px solid var(--line);border-radius:13px;
  text-align:left;transition:.16s;position:relative}
.optile:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,24,28,.09)}
.otx{display:flex;flex-direction:column;gap:3px}
.oname{font:700 16px var(--fd)}
.ocode{font:500 12px var(--fm);color:var(--teal-d);display:flex;gap:6px;align-items:center}
.oar{margin-left:auto;color:var(--teal);opacity:0;transform:translateX(-5px);transition:.18s}
.optile:hover .oar{opacity:1;transform:none}
.l-foot{margin-top:34px}
.empty{padding:38px 20px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center;font-size:14px}
.empty i{font-size:26px;opacity:.6} .empty.small{padding:20px}

/* ── wizard ───────────────────────────────── */
.searchbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 18px;margin-bottom:26px;
  box-shadow:0 1px 2px rgba(20,24,28,.05)}
.searchbar i{font-size:17px;color:var(--ink2)}
.searchbar input{flex:1;border:none;outline:none;padding:15px 0;font-size:15.5px;background:transparent}
.macroblok{margin-bottom:30px}
.macroname{font:700 13px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:9px;margin-bottom:12px}
.macroname::before{content:'';width:8px;height:8px;background:var(--teal);border-radius:2px;flex:none}
.microlbl{font:600 12.5px var(--fb);color:var(--ink2);display:flex;gap:7px;align-items:center;margin:14px 0 9px}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
.prodcard{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:16px 18px;background:#fff;border:1px solid var(--line);
  border-radius:12px;text-align:left;transition:.16s;position:relative}
.prodcard:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,24,28,.09)}
.prodcard>i{position:absolute;right:14px;bottom:13px;color:var(--teal);opacity:0;transition:.16s}
.prodcard:hover>i{opacity:1}
.pcod{font:500 11px var(--fm);background:#f1f2f4;border:1px solid #e4e7ea;border-radius:6px;padding:2px 7px;color:var(--ink2)}
.pname{font:700 15.5px var(--fd)}
.pmeta{font-size:12px;color:var(--ink2)}
.wz-top{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.prog{display:flex;gap:5px;flex:1;max-width:430px;margin:0 auto}
.seg{height:7px;flex:1;border:none;border-radius:4px;background:#e1e4e8;padding:0;transition:.2s}
.seg.done{background:var(--ink)} .seg.cur{background:var(--teal)}
.seg:hover{opacity:.8}
.count{font:500 12px var(--fm);color:var(--ink2)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:34px 36px;box-shadow:0 2px 10px rgba(20,24,28,.05)}
.qmeta{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;font:600 11.5px var(--fb);padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.chip.req{border-color:rgba(4,162,156,.45);color:var(--teal-d);background:rgba(4,162,156,.07)}
.qtext{font:700 27px/1.25 var(--fd);letter-spacing:-.4px;margin-bottom:24px}
.ansgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.ansgrid.two{grid-template-columns:1fr 1fr;max-width:480px}
.ans{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;background:#fff;border:1px solid #dfe3e7;
  border-radius:11px;font:500 15px var(--fb);color:var(--ink);transition:.14s;text-align:left}
.ans:hover{border-color:var(--ink)}
.ans.sel{border-color:var(--teal);background:rgba(4,162,156,.06);box-shadow:0 0 0 1px var(--teal)}
.ans.sel>i{color:var(--teal)}
.ans.big{padding:22px;font-size:18px;justify-content:center}
.mini-hint{margin-top:10px;font-size:12.5px;color:var(--ink2)}
.numwrap{display:flex;gap:12px;align-items:center;max-width:340px}
.numwrap .num{font:500 24px var(--fm)}
.unit{font:700 18px var(--fd);color:var(--ink2)}
.wz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.wz-foot .hint{color:var(--dng);font:600 13px var(--fb);display:flex;gap:6px;align-items:center}
.outhead{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.okbadge{width:48px;height:48px;border-radius:50%;background:rgba(4,162,156,.13);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.esitobox{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,28,.05)}
.esitobar{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;background:#f7f8f9;border-bottom:1px solid var(--line);
  font:600 12.5px var(--fb);color:var(--ink2)}
.esito{padding:24px 26px;font-size:15.5px;line-height:1.75;white-space:pre-wrap;font-family:var(--fb)}
.outbtns{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}

/* ── impostazioni ─────────────────────────── */
.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}
.tab{padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;font:600 13.5px var(--fb);color:var(--ink2);
  display:inline-flex;gap:8px;align-items:center;transition:.15s}
.tab:hover{border-color:var(--ink);color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.addrow{display:flex;gap:10px;margin-bottom:10px} .addrow.thin{margin:10px 0 0}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.6;margin-top:10px}
.rows{margin-top:14px}
.row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-top:1px solid #eef0f2}
.rtx{display:flex;flex-direction:column;gap:2px;flex:1} .rtx b{font-size:14.5px}
.opcode2{font-size:12px;color:var(--teal-d)}
.prod2{display:grid;grid-template-columns:355px 1fr;gap:16px;align-items:start}
.plist{max-height:calc(100vh - 250px);overflow:auto}
.prow{display:flex;gap:11px;align-items:center;width:100%;padding:11px 12px;border:none;border-radius:9px;background:transparent;text-align:left;transition:.13s}
.prow:hover{background:#f4f5f6}
.prow.on{background:var(--ink);color:#fff} .prow.on .mut{color:#aeb5bc} .prow.on .pcod{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.prw-t{display:flex;flex-direction:column;gap:2px} .prw-t b{font-size:14px}
.pedit-head{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.pedit-head .frow{margin:0} .pedit-head .grow{flex:1;min-width:190px}
.pedit-acts{display:flex;gap:8px;margin-left:auto}
.sec{font:700 15px var(--fd);margin:26px 0 12px;display:flex;gap:9px;align-items:center}
.sec i{color:var(--teal)}
.qrow{display:flex;gap:9px;align-items:center;padding:10px 12px;border:1px solid #e7eaee;border-radius:10px;margin-bottom:8px;background:#fcfcfd}
.qn{font-size:12px;color:var(--ink2);width:20px;text-align:center;flex:none}
.qtx{display:flex;flex-direction:column;gap:1px;flex:1} .qtx b{font-size:14px}
.qedit{margin-top:18px;border:1px solid #c9e6e4;background:#f5fbfa;border-radius:13px;padding:20px;animation:fadeup .3s}
.qedit h4{font:700 15px var(--fd);margin-bottom:16px;display:flex;gap:8px;align-items:center}
.qedit h4 i{color:var(--teal)}
.optrow{display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;margin-bottom:8px;align-items:center}
.checkrow{display:flex;gap:9px;align-items:center;font:600 13.5px var(--fb);margin-top:10px;cursor:pointer}
.switchrow{display:flex;gap:10px;align-items:center;font:600 14px var(--fb);margin:4px 0 14px;cursor:pointer}
.switchrow label,.checkrow label{margin:0;display:inline}
.qedit-acts{display:flex;gap:10px;margin-top:18px}
.sync2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.verbox{background:#f7f8f9;border-radius:10px;padding:14px 17px;display:flex;flex-direction:column;gap:3px;margin:14px 0}
.verbox b{font-size:18px;font-weight:500}
.btncol{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.btncol.row{flex-direction:row;flex-wrap:wrap}
.filebtn{cursor:pointer}
.ghgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.ghgrid .wide{grid-column:1/-1}
.ghhelp{margin-top:14px;font-size:13.5px}
.ghhelp summary{font:600 13.5px var(--fb);cursor:pointer;color:var(--teal-d)}
.ghhelp ol{padding-left:20px;margin-top:10px;color:var(--ink2);line-height:1.7}
.macrocard{margin-bottom:14px}
.mhead{display:flex;gap:10px;align-items:center} .mhead b{font:700 16px var(--fd)} .mhead i{color:var(--teal)}
.micros{margin-top:12px}
.micro-row{border-top:1px solid #eef0f2}
.micro-row>i:first-child{color:var(--ink2);font-size:13px}
.lastbk{border-top:1px dashed var(--line);margin-top:16px;padding-top:12px}

/* ── conflitti / modal / toast ────────────── */
.confl{display:flex;flex-direction:column;max-height:76vh}
.confl-head{padding:24px 26px 14px}
.confl-head h3{font:700 19px var(--fd);display:flex;gap:10px;align-items:center;margin-bottom:8px}
.confl-head h3 i{color:var(--teal)}
.confl-list{overflow:auto;padding:0 26px;flex:1}
.cfrow{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid #eef0f2}
.cftxt{display:flex;flex-direction:column;gap:3px} .cftxt b{font-size:14.5px}
.cftxt .pcod{margin-right:6px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg2 button{border:none;background:#fff;padding:8px 13px;font:600 12.5px var(--fb);color:var(--ink2)}
.seg2 button.on{background:var(--ink);color:#fff}
.confl-foot{display:flex;gap:10px;align-items:center;padding:16px 26px;border-top:1px solid var(--line)}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(28,31,35,.55);backdrop-filter:blur(2px)}
#modal.on{display:flex}
.mcard{background:#fff;border-radius:14px;width:min(440px,92vw);padding:24px 26px;animation:fadeup .25s;box-shadow:0 24px 60px rgba(10,12,14,.3)}
.mcard.wide{width:min(780px,94vw);padding:0}
.mhead{font:700 18px var(--fd);display:flex;gap:10px;align-items:center;margin-bottom:10px}
.mhead i{color:var(--teal)}
.mmsg{font-size:14px;color:var(--ink2);line-height:1.65;margin-bottom:20px}
.macts{display:flex;gap:10px;justify-content:flex-end}
#toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:9px;z-index:80}

<script>
'use strict';
/* ════════ helper ════════ */
const $=s=>document.querySelector(s);
const uid=()=>'x'+Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s||'').trim().toLowerCase();
const pad=n=>String(n).padStart(2,'0');
function nowStr(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtTs(t){if(!t)return '—';const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function dataOdierna(){const s=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)}
function codiceOperatore(op,d=new Date()){const iniz=((op.nome||'')[0]||'')+((op.cognome||'')[0]||'');return ('OP'+iniz+d.getDate()+pad(d.getMonth()+1)).toUpperCase()}
function iniziali(op){return (((op.nome||'')[0]||'')+((op.cognome||'')[0]||'')).toUpperCase()||'?'}
function b64enc(s){const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]);return btoa(bin)}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function stamp(){const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())}
async function copiaTxt(t){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}}
function toast(msg,icon){icon=icon||'check2-circle';const d=document.createElement('div');d.className='toast';d.innerHTML='<i class="bi bi-'+icon+'"></i><span>'+msg+'</span>';$('#toasts').appendChild(d);setTimeout(()=>d.classList.add('out'),3000);setTimeout(()=>d.remove(),3550)}

/* ════════ dati ════════ */
const LS_DB='goc_db_v1',LS_GH='goc_gh';
let db=null;
let S={route:'wizard',op:null,w:null,tab:'operatori',prodSel:null,qEdit:null,qDraft:null,ghStatus:'off',confl:null,lastTxt:''};
function saveDb(){localStorage.setItem(LS_DB,JSON.stringify(db))}
function loadGh(){try{return JSON.parse(localStorage.getItem(LS_GH))||{}}catch(e){return{}}}
function saveGhCfg(c){localStorage.setItem(LS_GH,JSON.stringify(c))}

function opts(a){return a.map(v=>({id:uid(),valore:v,testoOut:''}))}
function seed(){

    macro:[{id:ma1,nome:'Stampa digitale'},{id:ma2,nome:'Grande formato'}],
    micro:[{id:mi1,nome:'Biglietti da visita',macroId:ma1},{id:mi2,nome:'Volantini e flyer',macroId:ma1},{id:mi3,nome:'Poster e manifesti',macroId:ma2}],

      {id:uid(),codice:'BIG',nome:'Biglietti da visita',microId:mi1,domande:[
        D({testo:'Quantità',tipo:'numero',obbligatoria:true,unita:'pz'}),
        D({testo:'Tipologia carta',tipo:'scelta',obbligatoria:true,opzioni:opts(['Patinata lucida 300 g','Patinata opaca 350 g','Usomano 300 g','Carta perlescente 300 g'])}),
        D({testo:'Misura finita',tipo:'scelta',obbligatoria:true,conAltro:true,opzioni:opts(['85×55 mm','90×50 mm','55×55 mm (quadrato)'])}),
        D({testo:'Lato di stampa',tipo:'scelta',obbligatoria:true,opzioni:opts(['Solo fronte','Fronte/retro'])}),
        D({testo:'Colori',tipo:'scelta',obbligatoria:true,opzioni:opts(['Bianco e nero','1 colore','2 colori','3 colori','4 colori (CMYK)'])}),
        D({testo:'Plastificazione',tipo:'scelta',obbligatoria:true,opzioni:opts(['Nessuna','Lucida','Opaca','Soft touch'])}),
        D({testo:'Nobilitazione',tipo:'multipla',opzioni:opts(['Oro a caldo','Argento a caldo','Vernice UV a zona','Rilievo'])}),
        D({testo:'Angoli smussati',tipo:'si_no'}),
        D({testo:'Confezionati',tipo:'si_no'}),

      ]},
      {id:uid(),codice:'VOL',nome:'Volantini',microId:mi2,domande:[
        D({testo:'Quantità',tipo:'numero',obbligatoria:true,unita:'pz'}),
        D({testo:'Formato',tipo:'scelta',obbligatoria:true,conAltro:true,opzioni:opts(['A6 · 10,5×14,8 cm','A5 · 14,8×21 cm','A4 · 21×29,7 cm'])}),
        D({testo:'Carta',tipo:'scelta',obbligatoria:true,opzioni:opts(['Patino 130 g','Patino 170 g','Patino 200 g','Usomano 140 g'])}),

function loadDb(){try{const r=localStorage.getItem(LS_DB);if(r){db=JSON.parse(r);return}}catch(e){}db=seed();saveDb()}

/* ════════ CSV preset ════════ */
function csvParse(text){
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=c}
    else{if(c==='"')inQ=true;else if(c===';'){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);cur='';rows.push(row);row=[]}
    else if(c!=='\r')cur+=c}}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c!==''));
}
function csvCell(v){v=String(v??'');return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function dbToCsv(d){
  const rows=[['tipo','id','rif','ord','dati'],['VERSIONE','','','',d.meta.versione||'']];
  (d.operatori||[]).forEach((o,i)=>rows.push(['OPERATORE',o.id,'',i,JSON.stringify({nome:o.nome,cognome:o.cognome||''})]));
  (d.macro||[]).forEach((m,i)=>rows.push(['MACRO',m.id,'',i,JSON.stringify({nome:m.nome})]));
  (d.micro||[]).forEach((m,i)=>rows.push(['MICRO',m.id,m.macroId||'',i,JSON.stringify({nome:m.nome})]));
  (d.prodotti||[]).forEach((p,i)=>rows.push(['PRODOTTO',p.id,p.microId||'',i,JSON.stringify({codice:p.codice,nome:p.nome,domande:p.domande})]));
  return rows.map(r=>r.map(csvCell).join(';')).join('\r\n')+'\r\n';
}
function csvToDb(text){
  try{
    const rows=csvParse(String(text).trim());
    const d={operatori:[],macro:[],micro:[],prodotti:[],meta:{versione:''}};
    for(let i=1;i<rows.length;i++){
      const r=rows[i],tipo=r[0];if(!tipo)continue;
      let j={};try{j=r[4]?JSON.parse(r[4]):{}}catch(e){continue}
      if(tipo==='VERSIONE')d.meta.versione=r[4]||'';
      else if(tipo==='OPERATORE')d.operatori.push({id:r[1],nome:j.nome||'',cognome:j.cognome||''});
      else if(tipo==='MACRO')d.macro.push({id:r[1],nome:j.nome||''});
      else if(tipo==='MICRO')d.micro.push({id:r[1],macroId:r[2],nome:j.nome||''});
      else if(tipo==='PRODOTTO')d.prodotti.push({id:r[1],microId:r[2],codice:j.codice||'',nome:j.nome||'',domande:j.domande||[]});
    }
    d.meta={versione:d.meta.versione||nowStr(),lastBackup:null,lastPull:null,lastPush:null};
    return d;
  }catch(e){return null}
}

/* ════════ GitHub ════════ */
async function ghPull(manual){
  if(!/^https?:$/.test(location.protocol)){if(manual)toast('Apri l’app online (GitHub Pages) per scaricare i preset','info-circle');S.ghStatus='file';render();return}
  try{
    const r=await fetch('preset.csv?t='+Date.now(),{cache:'no-store'});
    if(!r.ok){S.ghStatus='nofile';if(manual)toast('preset.csv non trovato accanto a index.html','exclamation-triangle');render();return}
    const d=csvToDb(await r.text());
    if(!d){S.ghStatus='err';if(manual)toast('File CSV non valido','exclamation-triangle');render();return}
    if(d.meta.versione>db.meta.versione){
      const lb=db.meta.lastBackup;db=d;db.meta.lastBackup=lb;db.meta.lastPull=Date.now();saveDb();
      if(S.op&&!db.operatori.find(o=>o.id===S.op)){S.op=null;sessionStorage.removeItem('goc_op')}
      S.w=null;S.ghStatus='ok';toast('Preset aggiornati da GitHub · versione '+db.meta.versione,'cloud-arrow-down');
    }else{S.ghStatus='ok';if(manual)toast('Sei già aggiornato · versione '+db.meta.versione,'check2-circle')}
  }catch(e){S.ghStatus='err';if(manual)toast('Errore di rete: GitHub non raggiungibile','exclamation-triangle')}
  render();
}
async function ghPush(){
  const c=loadGh();
  if(!c.owner||!c.repo||!c.token){toast('Configura prima owner, repo e token in Impostazioni → Preset e GitHub','exclamation-triangle');S.tab='sync';S.route='settings';render();return false}
  db.meta.versione=nowStr();saveDb();
  const api='https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+(c.path||'preset.csv');
  const h={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  try{
    let sha=null;
    const g=await fetch(api+'?ref='+encodeURIComponent(c.branch||'main'),{headers:h});
    if(g.ok)sha=(await g.json()).sha;
    const body={message:'Aggiornamento preset · '+db.meta.versione,content:b64enc(dbToCsv(db)),branch:c.branch||'main'};
    if(sha)body.sha=sha;
    const r=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},h),body:JSON.stringify(body)});
    if(r.ok||r.status===201){db.meta.lastPush=Date.now();saveDb();toast('Pubblicato su GitHub: preset.csv sovrascritto ✓','cloud-arrow-up');render();return true}
    const e=await r.json().catch(()=>({}));
    toast('GitHub: '+(e.message||('errore '+r.status)),'exclamation-triangle');
  }catch(err){toast('Errore di rete verso GitHub','exclamation-triangle')}
  return false;
}
function saveGh(){
  saveGhCfg({owner:$('#ghOwner').value.trim(),repo:$('#ghRepo').value.trim(),branch:$('#ghBranch').value.trim()||'main',path:$('#ghPath').value.trim()||'preset.csv',token:$('#ghToken').value.trim()});
  toast('Configurazione GitHub salvata (solo in questo browser)','check2-circle');
}

/* ════════ merge / import ════════ */
function mergeDb(loc,inc,confl){
  const out=clone(loc);
  const macBy=new Map(out.macro.map(m=>[norm(m.nome),m]));
  const micBy=new Map(out.micro.map(m=>[norm(m.nome)+'|'+norm((out.macro.find(x=>x.id===m.macroId)||{}).nome||''),m]));
  function ensureMacro(n){let m=macBy.get(norm(n));if(!m){m={id:uid(),nome:n};out.macro.push(m);macBy.set(norm(n),m)}return m}
  function ensureMicro(maN,miN){const ma=ensureMacro(maN);const k=norm(miN)+'|'+norm(ma.nome);let m=micBy.get(k);if(!m){m={id:uid(),nome:miN,macroId:ma.id};out.micro.push(m);micBy.set(k,m)}return m}
  const opSet=new Set(out.operatori.map(o=>norm(o.nome)+'|'+norm(o.cognome||'')));
  for(const o of inc.operatori){const k=norm(o.nome)+'|'+norm(o.cognome||'');if(!opSet.has(k)){out.operatori.push({id:uid(),nome:o.nome,cognome:o.cognome||''});opSet.add(k)}}
  for(let pi=0;pi<inc.prodotti.length;pi++){
    const p=inc.prodotti[pi];
    const mi=inc.micro.find(m=>m.id===p.microId)||{};
    const ma=inc.macro.find(m=>m.id===mi.macroId)||{nome:'Generale'};
    const target=ensureMicro(ma.nome||'Generale',mi.nome||'Generale').id;
    const ci=confl?confl.idx.get(p):-1;
    if(ci===undefined||ci===-1||ci===undefined){}
    if(ci==null||ci===-1){out.prodotti.push({id:uid(),codice:p.codice,nome:p.nome,microId:target,domande:clone(p.domande)})}
    else if(confl.scelte[ci]==='inc'){const ex=out.prodotti.find(x=>norm(x.codice)===norm(p.codice));if(ex){ex.nome=p.nome;ex.domande=clone(p.domande);ex.microId=target}}
  }
  return out;
}
function onImportFile(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const d=csvToDb(String(rd.result));
    if(!d||(!d.prodotti.length&&!d.operatori.length)){toast('File non valido: usa un CSV esportato da questa app','exclamation-triangle');return}
    startImport(d)};
  rd.readAsText(f);
}
function startImport(inc){
  const items=[];const idx=new Map();
  inc.prodotti.forEach(p=>{const loc=db.prodotti.find(x=>norm(x.codice)===norm(p.codice));if(loc){idx.set(p,items.length);items.push({codice:p.codice,nome:p.nome,loc:loc,inc:p})}});
  S.confl={inc:inc,idx:idx,scelte:items.map(()=>'inc'),items:items};
  if(!items.length){
    ask({title:'Importa preset',icon:'upload',msg:'Nessun conflitto. Verranno aggiunti <b>'+inc.prodotti.length+' prodotti</b>, '+inc.operatori.length+' operatori e le categorie del file (versione <span class="mono">'+esc(inc.meta.versione)+'</span>).',ok:'Importa'})
    .then(ok=>{if(ok)applyMerge(false)});
  }else modalBox(vConflitti(),true);
}
function vConflitti(){
  const c=S.confl;
  return '<div class="confl"><div class="confl-head"><h3><i class="bi bi-arrow-repeat"></i> Prodotti già presenti</h3>'
   +'<p class="hint" style="margin-top:0">Il file in arrivo (versione <b class="mono">'+esc(c.inc.meta.versione)+'</b>) contiene prodotti con lo stesso codice dei tuoi. Per ciascuno scegli quale conservare. Categorie e operatori nuovi verranno comunque aggiunti.</p>'
   +'<div class="btncol row" style="margin-top:12px"><button class="btn btn-gh small" onclick="cfAll(\'inc\')"><i class="bi bi-cloud-arrow-down"></i> Usa sempre quelli in arrivo</button>'
   +'<button class="btn btn-gh small" onclick="cfAll(\'loc\')"><i class="bi bi-box-seam"></i> Tieni sempre i miei</button></div></div>'
   +'<div class="confl-list" id="conflBody">'+c.items.map(cfRow).join('')+'</div>'
   +'<div class="confl-foot"><button class="linkbtn dang" onclick="cfReplace()"><i class="bi bi-exclamation-triangle"></i> Sostituisci tutto il database</button><span class="sp"></span>'
   +'<button class="btn btn-gh" onclick="mDone(false)">Annulla</button>'
   +'<button class="btn btn-acc" onclick="applyMerge(false)"><i class="bi bi-check-lg"></i> Conferma e importa</button></div></div>';
}
function cfRow(c,i){
  const sel=S.confl.scelte[i];
  return '<div class="cfrow"><div class="cftxt"><div><span class="pcod">'+esc(c.codice)+'</span><b>'+esc(c.nome)+'</b></div>'
   +'<span class="mut">Il tuo: '+c.loc.domande.length+' domande · In arrivo: '+c.inc.domande.length+' domande</span></div>'
   +'<div class="seg2"><button class="'+(sel==='loc'?'on':'')+'" onclick="cfSet('+i+',\'loc\')">Tieni il mio</button>'
   +'<button class="'+(sel==='inc'?'on':'')+'" onclick="cfSet('+i+',\'inc\')">Usa in arrivo</button></div></div>';
}
function cfSet(i,v){S.confl.scelte[i]=v;$('#conflBody').innerHTML=S.confl.items.map(cfRow).join('')}
function cfAll(v){S.confl.scelte=S.confl.scelte.map(()=>v);$('#conflBody').innerHTML=S.confl.items.map(cfRow).join('')}
function cfReplace(){
  ask({title:'Sostituisci tutto',icon:'exclamation-triangle',danger:true,msg:'Il database attuale verrà <b>completamente sostituito</b> dal file importato. Continuare?',ok:'Sostituisci'})
  .then(ok=>{if(ok)applyMerge(true)});
}
function applyMerge(replace){
  const inc=S.confl.inc;
  if(replace){const lb=db.meta.lastBackup;db=clone(inc);db.meta.lastBackup=lb}
  else db=mergeDb(db,inc,{idx:S.confl.idx,scelte:S.confl.scelte});
  db.meta.versione=nowStr();
  const ghOk=!!loadGh().token;
  S.confl=null;S.w=null;saveDb();closeModal();render();
  toast('Import completato · nuova versione '+db.meta.versione,'upload');
  if(ghOk)ask({title:'Aggiorna il team',icon:'github',msg:'Pubblico ora il nuovo <span class="mono">preset.csv</span> su GitHub? Così facendo il file viene sovrascritto e gli altri PC riceveranno l’aggiornamento alla prossima apertura.',ok:'Pubblica su GitHub'})
    .then(ok=>{if(ok)ghPush()});
}

/* ════════ export ════════ */
function exportAll(){db.meta.lastBackup=Date.now();saveDb();download('guida-ordini_backup_'+stamp()+'.csv',dbToCsv(db));toast('Backup completo scaricato','download');render()}
function exportMacro(){
  const ma=db.macro.find(m=>m.id===$('#expMacro').value);
  if(!ma){toast('Nessuna macro categoria da esportare','exclamation-triangle');return}
  const micros=db.micro.filter(m=>m.macroId===ma.id);const ids=new Set(micros.map(m=>m.id));
  const sub={operatori:db.operatori,macro:[ma],micro:micros,prodotti:db.prodotti.filter(p=>ids.has(p.microId)),meta:{versione:db.meta.versione}};
  db.meta.lastBackup=Date.now();saveDb();
  download('guida-ordini_'+norm(ma.nome).replace(/[^a-z0-9]+/g,'-')+'_'+stamp()+'.csv',dbToCsv(sub));
  toast('Categoria “'+esc(ma.nome)+'” esportata','download');render();
}

/* ════════ viste: login & shell ════════ */
function go(r){S.route=r;if(r!=='settings'){}render()}
function goLogin(){S.op=null;sessionStorage.removeItem('goc_op');S.route='wizard';render()}
function goSettingsFree(){S.route='settings';render()}
function pickOp(id){S.op=id;sessionStorage.setItem('goc_op',id);S.route='wizard';S.w=null;render()}
function logout(){goLogin()}
function curOp(){return db.operatori.find(o=>o.id===S.op)}

function render(){
  if(S.op&&!curOp()){S.op=null}
  const root=$('#root');
  if(!S.op&&S.route!=='settings'){root.innerHTML=vLogin();afterRender();return}
  root.innerHTML=shell(S.route==='settings'?vSettings():vWizard());
  afterRender();
}
function afterRender(){const f=$('#autofocus');if(f)f.focus();const q=$('#qedit');if(q)q.scrollIntoView({block:'nearest'})}

function shell(content){
  const op=curOp();
  const ghLab={ok:'GitHub sincronizzato',nofile:'preset.csv non trovato',err:'GitHub non raggiungibile',file:'Uso locale (aperto da file)',off:'GitHub: verifica in corso…'}[S.ghStatus]||'GitHub';
  const nav=(r,ic,lbl)=>'<button class="snav '+(S.route===r?'on':'')+'" onclick="go(\''+r+'\')"><i class="bi '+ic+'"></i>'+lbl+'</button>';
  return '<div class="shell"><aside class="side">'
   +'<div><div class="brand-k">Stampa · Ordini</div><div class="brand-t">Guida Ordini<br><span>Cliente</span></div></div>'
   +'<nav class="sidenav">'+nav('wizard','bi-clipboard2-check','Nuovo ordine')+nav('settings','bi-gear','Impostazioni')+'</nav>'

/* ════════ wizard ════════ */
function vWizard(){
  if(!S.w)return wPick();
  const p=db.prodotti.find(x=>x.id===S.w.pid);
  if(!p){S.w=null;return wPick()}
  return S.w.fase==='out'?wOut(p):wQ(p);
}
function wPick(){
  return '<div class="fade"><div class="phead"><div class="crumb">Nuovo ordine · passo 1</div><h1>Che prodotto devi fare?</h1></div>'
   +'<div class="searchbar"><i class="bi bi-search"></i><input id="autofocus" placeholder="Cerca per nome o codice…" oninput="filterWz(this.value)"></div>'
   +'<div id="wzList">'+wzListHtml('')+'</div></div>';
}
function wzListHtml(q){
  const f=norm(q);let html='';
  for(const ma of db.macro){
    let mHtml='';
    for(const mi of db.micro.filter(m=>m.macroId===ma.id)){
      const prods=db.prodotti.filter(p=>p.microId===mi.id&&(!f||norm(p.nome).includes(f)||norm(p.codice).includes(f)));
      if(!prods.length)continue;
      mHtml+='<div class="microlbl"><i class="bi bi-tag"></i>'+esc(mi.nome)+'</div><div class="prodgrid">'
        +prods.map(p=>'<button class="prodcard" onclick="pickProd(\''+p.id+'\')"><span class="pcod">'+esc(p.codice)+'</span>'
          +'<span class="pname">'+esc(p.nome)+'</span><span class="pmeta">'+p.domande.length+' domande</span><i class="bi bi-arrow-right"></i></button>').join('')+'</div>';
    }
    if(mHtml)html+='<section class="macroblok"><h3 class="macroname">'+esc(ma.nome)+'</h3>'+mHtml+'</section>';
  }
  return html||('<div class="card pad empty"><i class="bi bi-box-seam"></i>'+(db.prodotti.length?'Nessun prodotto trovato per questa ricerca.':'Nessun prodotto configurato: aggiungili da Impostazioni → Prodotti e domande.')+'</div>');
}
function filterWz(v){$('#wzList').innerHTML=wzListHtml(v)}
function pickProd(id){S.w={pid:id,fase:'q',i:0,ris:{}};render()}
function curProd(){return S.w?db.prodotti.find(x=>x.id===S.w.pid):null}

function answered(q){
  const r=S.w.ris[q.id];
  if(q.tipo==='multipla')return Array.isArray(r)&&r.length>0;
  if(r===undefined||r===null)return false;
  if(q.tipo==='scelta')return r.t==='opt'?true:String(r.v||'').trim()!=='';
  return String(r).trim()!=='';
}
function wQ(p){
  const n=p.domande.length;
  if(!n){S.w.fase='out';return wOut(p)}
  const i=S.w.i,q=p.domande[i],ok=answered(q);
  const prog=p.domande.map((d,k)=>'<button class="seg '+(k<i?'done':'')+(k===i?' cur':'')+'" '+(k<=i?'onclick="wJump('+k+')"':'')+'></button>').join('');
  return '<div class="fade"><div class="wz-top">'
   +'<button class="linkbtn" onclick="wBack()"><i class="bi bi-arrow-left"></i> '+(i===0?'Prodotti':'Indietro')+'</button>'
   +'<div class="prog">'+prog+'</div><div class="count">'+(i+1)+' / '+n+'</div></div>'
   +'<div class="qcard"><div class="qmeta"><span class="chip"><i class="bi bi-box-seam"></i> '+esc(p.nome)+' · '+esc(p.codice)+'</span>'
   +(q.obbligatoria?'<span class="chip req">Obbligatoria</span>':'<span class="chip">Facoltativa</span>')+'</div>'
   +'<h2 class="qtext">'+esc(q.testo)+'</h2>'+ansArea(q)+'</div>'
   +'<div class="wz-foot"><span class="hint">'+(q.obbligatoria&&!ok?'<i class="bi bi-exclamation-circle"></i> Risposta obbligatoria':'')+'</span>'
   +'<button class="btn btn-pr big" '+(ok?'':'disabled')+' onclick="wNext()">Avanti <i class="bi bi-arrow-right"></i></button></div></div>';
}
function ansArea(q){
  const r=S.w.ris[q.id];
  if(q.tipo==='scelta'){
    const selOpt=r&&r.t==='opt'?r.v:null,altro=r&&r.t==='altro';
    return '<div class="ansgrid">'+q.opzioni.map(o=>'<button class="ans '+(selOpt===o.id?'sel':'')+'" onclick="ansScelta(\''+q.id+'\',\''+o.id+'\')">'
      +'<span>'+esc(o.valore)+'</span>'+(selOpt===o.id?'<i class="bi bi-check-lg"></i>':'')+'</button>').join('')
      +(q.conAltro?'<button class="ans '+(altro?'sel':'')+'" onclick="ansAltro(\''+q.id+'\')"><span><i class="bi bi-pencil"></i> Altro…</span>'+(altro?'<i class="bi bi-check-lg"></i>':'')+'</button>':'')
      +'</div>'+(altro?'<div style="margin-top:12px"><input class="inp inp-big" id="autofocus" placeholder="Scrivi la risposta…" value="'+esc(r.v)+'" oninput="risAltro(\''+q.id+'\',this.value)" onkeydown="if(event.key===\'Enter\')wNext()"></div>':'');
  }
  if(q.tipo==='multipla'){
    const arr=Array.isArray(r)?r:[];
    return '<div class="ansgrid">'+q.opzioni.map(o=>'<button class="ans '+(arr.includes(o.id)?'sel':'')+'" onclick="ansMulti(\''+q.id+'\',\''+o.id+'\')">'
      +'<span>'+esc(o.valore)+'</span>'+(arr.includes(o.id)?'<i class="bi bi-check-lg"></i>':'')+'</button>').join('')+'</div>'
      +'<div class="mini-hint"><i class="bi bi-ui-checks"></i> Puoi scegliere più voci.</div>';
  }
  if(q.tipo==='si_no'){
    return '<div class="ansgrid two">'+['si','no'].map(v=>'<button class="ans big '+(r===v?'sel':'')+'" onclick="ansSiNo(\''+q.id+'\',\''+v+'\')">'
      +'<span>'+(v==='si'?'<i class="bi bi-check-lg"></i> Sì':'<i class="bi bi-x-lg"></i> No')+'</span></button>').join('')+'</div>';
  }
  if(q.tipo==='numero'){
    return '<div class="numwrap"><input type="number" min="0" class="inp inp-big num" id="autofocus" placeholder="0" value="'+esc(r||'')+'" oninput="risSet(\''+q.id+'\',this.value)" onkeydown="if(event.key===\'Enter\')wNext()">'
      +(q.unita?'<span class="unit">'+esc(q.unita)+'</span>':'')+'</div>';
  }
  return '<input class="inp inp-big" id="autofocus" placeholder="Scrivi qui…" value="'+esc(r||'')+'" oninput="risSet(\''+q.id+'\',this.value)" onkeydown="if(event.key===\'Enter\')wNext()">';
}
function autoNext(){setTimeout(()=>{const p=curProd();if(p&&S.w.fase==='q'&&answered(p.domande[S.w.i]))wNext()},260)}
function ansScelta(qid,oid){S.w.ris[qid]={t:'opt',v:oid};render();autoNext()}
function ansAltro(qid){S.w.ris[qid]={t:'altro',v:''};render()}
function risAltro(qid,v){S.w.ris[qid]={t:'altro',v:v}}
function ansMulti(qid,oid){const a=Array.isArray(S.w.ris[qid])?S.w.ris[qid].slice():[];const k=a.indexOf(oid);k>=0?a.splice(k,1):a.push(oid);S.w.ris[qid]=a;render()}
function ansSiNo(qid,v){S.w.ris[qid]=v;render();autoNext()}
function risSet(qid,v){S.w.ris[qid]=v}
function wNext(){const p=curProd(),q=p.domande[S.w.i];if(q.obbligatoria&&!answered(q))return;if(S.w.i>=p.domande.length-1)S.w.fase='out';else S.w.i++;render()}
function wBack(){if(S.w.i>0){S.w.i--;render()}else{S.w=null;render()}}
function wJump(k){if(S.w.fase==='q'&&k<=S.w.i){S.w.i=k;render()}}

function renderAns(q,r){
  if(q.tipo==='scelta'){
    if(!r)return null;
    if(r.t==='altro')return String(r.v||'').trim()||null;
    const o=q.opzioni.find(x=>x.id===r.v);return o?(o.testoOut||o.valore):null;
  }
  if(q.tipo==='multipla'){
    if(!r||!r.length)return null;
    return r.map(id=>{const o=q.opzioni.find(x=>x.id===id);return o?(o.testoOut||o.valore):null}).filter(Boolean).join(', ');
  }
  if(q.tipo==='si_no'){
    if(r==='si')return q.siTesto||'Sì';
    if(r==='no'){if(!q.noMode||q.noMode==='salta')return null;if(q.noMode==='testo')return q.noTesto||'No';return 'No'}
    return null;
  }
  const s=String(r??'').trim();if(!s)return null;
  if(q.tipo==='numero'&&q.unita)return s+' '+q.unita;
  return s;
}
function buildText(p){
  const lines=[];
  for(const q of p.domande){const a=renderAns(q,S.w.ris[q.id]);if(a===null)continue;lines.push((q.etichetta||q.testo)+': '+a)}
  const op=curOp();
  return lines.join('\n')+'\n\nCod. Operatore: '+(op?codiceOperatore(op):'—');
}
function wOut(p){
  S.lastTxt=buildText(p);
  return '<div class="fade"><div class="outhead"><span class="okbadge"><i class="bi bi-check-lg"></i></span>'
   +'<div><div class="crumb">Nuovo ordine · completato</div><h1 style="font:700 27px var(--fd)">'+esc(p.nome)+'</h1></div></div>'
   +'<div class="esitobox"><div class="esitobar"><span><i class="bi bi-file-earmark-text"></i> Descrizione pronta da incollare in Danea</span><span class="mono">'+esc(p.codice)+'</span></div>'
   +'<pre class="esito">'+esc(S.lastTxt)+'</pre></div>'
   +'<div class="outbtns"><button class="btn btn-acc xl" id="btnCopy" onclick="copiaEsito()"><i class="bi bi-copy"></i> Copia testo</button>'
   +'<button class="btn btn-gh big" onclick="nuovoOrdine()"><i class="bi bi-plus-lg"></i> Nuovo ordine</button>'
   +'<button class="linkbtn" onclick="S.w.fase=\'q\';S.w.i='+Math.max(0,p.domande.length-1)+';render()"><i class="bi bi-pencil"></i> Modifiche</button></div></div>';
}
function copiaEsito(){
  copiaTxt(S.lastTxt);const b=$('#btnCopy');
  if(b){b.innerHTML='<i class="bi bi-check-lg"></i> Copiato!';setTimeout(()=>{const x=$('#btnCopy');if(x)x.innerHTML='<i class="bi bi-copy"></i> Copia testo'},1800)}
  toast('Testo copiato negli appunti','copy');
}
function nuovoOrdine(){S.w=null;render()}

function vSettings(){
  const tabs=[['operatori','bi-people','Operatori'],['categorie','bi-diagram-3','Categorie'],['prodotti','bi-box-seam','Prodotti e domande'],['sync','bi-cloud-arrow-up','Preset e GitHub']];

/* — operatori — */
function tOperatori(){
  const rows=db.operatori.map(o=>'<div class="row"><span class="opav">'+iniziali(o)+'</span>'
   +'<div class="rtx"><b>'+esc(o.nome)+(o.cognome?' '+esc(o.cognome):'')+'</b><span class="mono opcode2">'+codiceOperatore(o)+' <span class="mut">· codice di oggi</span></span></div>'
   +'<button class="ibtn dang" title="Elimina" onclick="delOp(\''+o.id+'\')"><i class="bi bi-trash3"></i></button></div>').join('');
  const oggi=new Date(),es='OPG'+oggi.getDate()+pad(oggi.getMonth()+1);
  return '<div class="card pad"><div class="addrow"><input class="inp" id="opNome" placeholder="Nome (es. Giuseppe)"><input class="inp" id="opCogn" placeholder="Cognome (facoltativo)">'
   +'<button class="btn btn-pr" onclick="addOp()"><i class="bi bi-plus-lg"></i> Aggiungi</button></div>'
   +'<p class="hint" style="margin-top:0">Il codice si genera da solo: <b>OP</b> + iniziali + data del giorno. Esempio: Giuseppe oggi → <span class="mono">'+es+'</span>. Due omonimi si distinguono con l’iniziale del cognome: Salvo G. → <span class="mono">OPSG'+oggi.getDate()+pad(oggi.getMonth()+1)+'</span>, Salvo P. → <span class="mono">OPSP'+oggi.getDate()+pad(oggi.getMonth()+1)+'</span>.</p>'
   +(rows?'<div class="rows">'+rows+'</div>':'<div class="empty small">Nessun operatore.</div>')+'</div>';

function addOp(){
  const nome=$('#opNome').value.trim(),cognome=$('#opCogn').value.trim();
  if(!nome){toast('Inserisci almeno il nome','exclamation-triangle');return}
  db.operatori.push({id:uid(),nome:nome,cognome:cognome});saveDb();render();toast('Operatore aggiunto','check2-circle');
}
function delOp(id){
  const o=db.operatori.find(x=>x.id===id);
  ask({title:'Elimina operatore',icon:'trash3',danger:true,msg:'Rimuovere <b>'+esc(o.nome)+(o.cognome?' '+esc(o.cognome):'')+'</b>? I testi già copiati in Danea non vengono toccati.',ok:'Elimina'})
  .then(ok=>{if(ok){db.operatori=db.operatori.filter(x=>x.id!==id);if(S.op===id){S.op=null;sessionStorage.removeItem('goc_op')}saveDb();render()}});
}

/* — categorie — */
function tCategorie(){
  const blocks=db.macro.map(ma=>{
    const micros=db.micro.filter(m=>m.macroId===ma.id);
    return '<div class="card pad macrocard"><div class="mhead"><i class="bi bi-folder2-open"></i><b>'+esc(ma.nome)+'</b><span class="mut">'+micros.length+' micro</span><span class="sp"></span>'
     +'<button class="ibtn" title="Rinomina" onclick="renMacro(\''+ma.id+'\')"><i class="bi bi-pencil"></i></button>'
     +'<button class="ibtn dang" title="Elimina" onclick="delMacro(\''+ma.id+'\')"><i class="bi bi-trash3"></i></button></div><div class="micros">'
     +micros.map(mi=>{const np=db.prodotti.filter(p=>p.microId===mi.id).length;
        return '<div class="row micro-row"><i class="bi bi-tag"></i><div class="rtx"><b>'+esc(mi.nome)+'</b><span class="mut">'+np+' prodott'+(np===1?'o':'i')+'</span></div>'
        +'<button class="ibtn" onclick="renMicro(\''+mi.id+'\')"><i class="bi bi-pencil"></i></button>'
        +'<button class="ibtn dang" onclick="delMicro(\''+mi.id+'\')"><i class="bi bi-trash3"></i></button></div>'}).join('')
     +'<div class="addrow thin"><input class="inp" id="nm-'+ma.id+'" placeholder="Nuova micro categoria…"><button class="btn btn-gh" onclick="addMicro(\''+ma.id+'\')"><i class="bi bi-plus-lg"></i></button></div>'
     +'</div></div>';
  }).join('');
  return '<div class="card pad"><div class="addrow"><input class="inp" id="newMacro" placeholder="Nuova macro categoria (es. Stampa digitale)">'
   +'<button class="btn btn-pr" onclick="addMacro()"><i class="bi bi-plus-lg"></i> Aggiungi macro</button></div>'
   +'<p class="hint" style="margin-top:0">Macro → Micro → Prodotti: così l’operatore trova subito quello che cerca.</p></div>'
   +(blocks||'<div class="card pad empty" style="margin-top:14px"><i class="bi bi-diagram-3"></i>Nessuna macro categoria.</div>');
}
function addMacro(){const v=$('#newMacro').value.trim();if(!v)return;db.macro.push({id:uid(),nome:v});saveDb();render()}
function addMicro(mid){const v=$('#nm-'+mid).value.trim();if(!v)return;db.micro.push({id:uid(),nome:v,macroId:mid});saveDb();render()}
function renMacro(id){const m=db.macro.find(x=>x.id===id);const v=prompt('Nome macro categoria:',m.nome);if(v&&v.trim()){m.nome=v.trim();saveDb();render()}}
function renMicro(id){const m=db.micro.find(x=>x.id===id);const v=prompt('Nome micro categoria:',m.nome);if(v&&v.trim()){m.nome=v.trim();saveDb();render()}}
function delMacro(id){
  if(db.micro.some(m=>m.macroId===id)){toast('Elimina prima le micro categorie al suo interno','exclamation-triangle');return}
  ask({title:'Elimina macro',icon:'trash3',danger:true,msg:'Eliminare questa macro categoria?',ok:'Elimina'}).then(ok=>{if(ok){db.macro=db.macro.filter(m=>m.id!==id);saveDb();render()}});
}
function delMicro(id){
  if(db.prodotti.some(p=>p.microId===id)){toast('Ci sono prodotti in questa micro categoria: spostali prima','exclamation-triangle');return}
  ask({title:'Elimina micro',icon:'trash3',danger:true,msg:'Eliminare questa micro categoria?',ok:'Elimina'}).then(ok=>{if(ok){db.micro=db.micro.filter(m=>m.id!==id);saveDb();render()}});
}

/* — prodotti & domande — */
function tipoLabel(t){return {scelta:'Risposta singola',multipla:'Scelta multipla',si_no:'Sì / No',numero:'Numero',testo:'Testo libero'}[t]||t}
function tProdotti(){
  return '<div class="prod2"><div class="card pad plist"><div class="addrow thin" style="margin:0 0 10px"><input class="inp" placeholder="Cerca prodotto…" oninput="filterProd(this.value)">'
   +'<button class="btn btn-pr" title="Nuovo prodotto" onclick="addProd()"><i class="bi bi-plus-lg"></i></button></div>'
   +'<div id="prodList">'+prodListHtml('')+'</div></div>'
   +'<div>'+(S.prodSel?prodEditor():'<div class="card pad empty"><i class="bi bi-box-seam"></i>Seleziona un prodotto dall’elenco<br>oppure creane uno con <i class="bi bi-plus-lg"></i></div>')+'</div></div>';
}
function prodListHtml(f){
  const q=norm(f);
  const list=db.prodotti.filter(p=>!q||norm(p.nome).includes(q)||norm(p.codice).includes(q));
  if(!list.length)return '<div class="empty small">Nessun prodotto.</div>';
  return list.map(p=>{const mi=db.micro.find(m=>m.id===p.microId);const ma=mi&&db.macro.find(m=>m.id===mi.macroId);
    return '<button class="prow '+(S.prodSel===p.id?'on':'')+'" onclick="selProd(\''+p.id+'\')"><span class="pcod">'+esc(p.codice)+'</span>'
    +'<span class="prw-t"><b>'+esc(p.nome)+'</b><span class="mut">'+(ma?esc(ma.nome)+' / ':'')+(mi?esc(mi.nome):'—')+' · '+p.domande.length+' domande</span></span></button>'}).join('');
}
function filterProd(v){$('#prodList').innerHTML=prodListHtml(v)}
function selProd(id){S.prodSel=id;S.qEdit=null;render()}
function addProd(){
  let mi=db.micro[0];
  if(!mi){const ma={id:uid(),nome:'Generale'};db.macro.push(ma);mi={id:uid(),nome:'Generale',macroId:ma.id};db.micro.push(mi)}
  const p={id:uid(),codice:'NUOVO',nome:'Nuovo prodotto',microId:mi.id,domande:[]};
  db.prodotti.push(p);S.prodSel=p.id;S.qEdit=null;saveDb();render();
}
function saveProdHead(){
  const p=db.prodotti.find(x=>x.id===S.prodSel);if(!p)return;
  p.codice=$('#pCod').value.trim()||p.codice;
  p.nome=$('#pNome').value.trim()||p.nome;
  p.microId=$('#pMicro').value||p.microId;
  saveDb();render();
}
function dupProd(id){
  const p=db.prodotti.find(x=>x.id===id);
  let code=p.codice+'-BIS',n=2;while(db.prodotti.some(x=>norm(x.codice)===norm(code))){code=p.codice+'-BIS'+n;n++}
  const c=clone(p);c.id=uid();c.codice=code;c.nome=p.nome+' (copia)';
  db.prodotti.push(c);S.prodSel=c.id;S.qEdit=null;saveDb();render();toast('Prodotto duplicato','files');
}
function delProd(id){
  const p=db.prodotti.find(x=>x.id===id);
  ask({title:'Elimina prodotto',icon:'trash3',danger:true,msg:'Eliminare <b>'+esc(p.nome)+'</b> e tutte le sue domande?',ok:'Elimina'})
  .then(ok=>{if(ok){db.prodotti=db.prodotti.filter(x=>x.id!==id);if(S.prodSel===id){S.prodSel=null;S.qEdit=null}saveDb();render()}});
}
function prodEditor(){
  const p=db.prodotti.find(x=>x.id===S.prodSel);if(!p){S.prodSel=null;return ''}
  const optsH=db.macro.map(ma=>'<optgroup label="'+esc(ma.nome)+'">'+db.micro.filter(m=>m.macroId===ma.id).map(mi=>'<option value="'+mi.id+'" '+(p.microId===mi.id?'selected':'')+'>'+esc(mi.nome)+'</option>').join('')+'</optgroup>').join('');
  const qrows=p.domande.map((q,k)=>'<div class="qrow"><span class="qn mono">'+pad(k+1)+'</span>'
   +'<span class="qtx"><b>'+esc(q.testo)+'</b><span class="mut">'+tipoLabel(q.tipo)+(q.obbligatoria?' · obbligatoria':' · facoltativa')+'</span></span>'
   +'<button class="ibtn" onclick="moveQ(\''+q.id+'\',-1)" '+(k===0?'disabled':'')+'><i class="bi bi-chevron-up"></i></button>'
   +'<button class="ibtn" onclick="moveQ(\''+q.id+'\',1)" '+(k===p.domande.length-1?'disabled':'')+'><i class="bi bi-chevron-down"></i></button>'
   +'<button class="ibtn" title="Modifica" onclick="openQ(\''+q.id+'\')"><i class="bi bi-pencil"></i></button>'
   +'<button class="ibtn dang" title="Elimina" onclick="delQ(\''+q.id+'\')"><i class="bi bi-trash3"></i></button></div>').join('');
  return '<div class="card pad"><div class="pedit-head">'
   +'<div class="frow"><label>Codice prodotto</label><input class="inp mono" id="pCod" value="'+esc(p.codice)+'" onchange="saveProdHead()"></div>'
   +'<div class="frow grow"><label>Nome prodotto</label><input class="inp" id="pNome" value="'+esc(p.nome)+'" onchange="saveProdHead()"></div>'
   +'<div class="frow"><label>Categoria</label><select class="inp" id="pMicro" onchange="saveProdHead()">'+optsH+'</select></div>'
   +'<div class="pedit-acts"><button class="btn btn-gh" onclick="dupProd(\''+p.id+'\')"><i class="bi bi-files"></i> Duplica</button>'
   +'<button class="btn btn-dng" title="Elimina prodotto" onclick="delProd(\''+p.id+'\')"><i class="bi bi-trash3"></i></button></div></div>'
   +'<h3 class="sec"><i class="bi bi-patch-question"></i> Questionario <span class="mut">· '+p.domande.length+' domande</span></h3>'
   +(qrows||'<div class="empty small">Nessuna domanda: aggiungine una.</div>')
   +'<div style="margin-top:12px"><button class="btn btn-pr" onclick="openQ(\'new\')"><i class="bi bi-plus-lg"></i> Aggiungi domanda</button></div>'
   +(S.qEdit?qEditor(p):'')+'</div>';
}
function openQ(id){
  S.qEdit=id;
  if(id==='new')S.qDraft={testo:'',etichetta:'',tipo:'scelta',obbligatoria:true,opzioni:[],conAltro:false,siText:'Sì',siTesto:'Sì',noMode:'salta',noTesto:'',unita:''};
  else S.qDraft=clone(db.prodotti.find(x=>x.id===S.prodSel).domande.find(x=>x.id===id));
  render();
}
function closeQ(){S.qEdit=null;S.qDraft=null;render()}
function qTipoChange(){S.qDraft.tipo=$('#qTipo').value;$('#qTipoOpts').innerHTML=tipoOptsHtml(S.qDraft)}
function optRowHtml(o){
  return '<div class="optrow" data-oid="'+(o.id||uid())+'">'
   +'<input class="inp o-val" value="'+esc(o.valore||'')+'" placeholder="Opzione (es. Patinata opaca 350 g)">'
   +'<input class="inp o-out" value="'+esc(o.testoOut||'')+'" placeholder="Nel testo finale (vuoto = uguale)">'
   +'<button class="ibtn dang" onclick="this.closest(\'.optrow\').remove()"><i class="bi bi-x-lg"></i></button></div>';
}
function addOptRow(){const c=$('#optRows');if(c)c.insertAdjacentHTML('beforeend',optRowHtml({}))}
function tipoOptsHtml(q){
  if(q.tipo==='scelta'||q.tipo==='multipla'){
    return '<div class="frow"><label>Opzioni preimpostate</label><div id="optRows">'+(q.opzioni||[]).map(optRowHtml).join('')+'</div>'
     +'<button class="btn btn-gh small" onclick="addOptRow()"><i class="bi bi-plus-lg"></i> Opzione</button>'
     +'<label class="checkrow"><input type="checkbox" id="qAltro" '+(q.conAltro?'checked':'')+'> Consenti risposta libera “Altro…”</label></div>';
  }
  if(q.tipo==='si_no'){
    return '<div class="frow2"><div class="frow"><label>Se risponde Sì, nel testo scrivi</label><input class="inp" id="qSi" value="'+esc(q.siTesto||'Sì')+'"></div>'
     +'<div class="frow"><label>Se risponde No</label><select class="inp" id="qNoMode">'
     +'<option value="salta" '+(q.noMode==='salta'||!q.noMode?'selected':'')+'>Salta la riga</option>'
     +'<option value="no" '+(q.noMode==='no'?'selected':'')+'>Scrivi “No”</option>'
     +'<option value="testo" '+(q.noMode==='testo'?'selected':'')+'>Testo personalizzato</option></select></div></div>'
     +(q.noMode==='testo'?'<div class="frow"><label>Testo per il No</label><input class="inp" id="qNoTxt" value="'+esc(q.noTesto||'')+'"></div>':'');
  }
  if(q.tipo==='numero')return '<div class="frow"><label>Unità di misura</label><input class="inp" id="qUnita" value="'+esc(q.unita||'')+'" placeholder="es. pz, kg, m²"></div>';
  return '<p class="hint">L’operatore scriverà testo libero: usalo solo dove serve davvero (es. Note). Se vuoto, la riga non compare nel testo finale.</p>';
}
function qEditor(p){
  const isNew=S.qEdit==='new',q=S.qDraft;
  return '<div class="qedit" id="qedit"><h4><i class="bi bi-patch-question"></i> '+(isNew?'Nuova domanda':'Modifica domanda')+'</h4>'
   +'<div class="frow"><label>Testo della domanda <span class="mut">· quello che legge l’operatore</span></label><input class="inp" id="qTesto" value="'+esc(q.testo)+'" placeholder="Es. Tipologia carta"></div>'
   +'<div class="frow2"><div class="frow"><label>Etichetta nel testo finale <span class="mut">· vuoto = usa la domanda</span></label><input class="inp" id="qEti" value="'+esc(q.etichetta||'')+'"></div>'
   +'<div class="frow"><label>Tipo di risposta</label><select class="inp" id="qTipo" onchange="qTipoChange()">'
   +['scelta','multipla','si_no','numero','testo'].map(t=>'<option value="'+t+'" '+(q.tipo===t?'selected':'')+'>'+tipoLabel(t)+'</option>').join('')+'</select></div></div>'
   +'<label class="switchrow"><input type="checkbox" id="qObb" '+(q.obbligatoria?'checked':'')+'> Risposta obbligatoria</label>'
   +'<div id="qTipoOpts">'+tipoOptsHtml(q)+'</div>'
   +'<div class="qedit-acts"><button class="btn btn-acc" onclick="saveQ()"><i class="bi bi-check-lg"></i> Salva domanda</button>'
   +'<button class="btn btn-gh" onclick="closeQ()">Annulla</button></div></div>';
}
function saveQ(){
  const p=db.prodotti.find(x=>x.id===S.prodSel),d=S.qDraft;
  d.testo=$('#qTesto').value.trim();
  d.etichetta=$('#qEti').value.trim();
  d.tipo=$('#qTipo').value;
  d.obbligatoria=$('#qObb').checked;
  if(!d.testo){toast('Scrivi il testo della domanda','exclamation-triangle');return}
  if(d.tipo==='scelta'||d.tipo==='multipla'){
    d.conAltro=!!$('#qAltro')&&$('#qAltro').checked;
    d.opzioni=[...document.querySelectorAll('#optRows .optrow')].map(r=>({id:r.dataset.oid,valore:r.querySelector('.o-val').value.trim(),testoOut:r.querySelector('.o-out').value.trim()})).filter(o=>o.valore);
    if(!d.opzioni.length&&!d.conAltro){toast('Aggiungi almeno un’opzione','exclamation-triangle');return}
  }
  if(d.tipo==='si_no'){d.siTesto=($('#qSi')&&$('#qSi').value.trim())||'Sì';d.noMode=$('#qNoMode').value;d.noTesto=($('#qNoTxt')&&$('#qNoTxt').value.trim())||''}
  if(d.tipo==='numero')d.unita=($('#qUnita')&&$('#qUnita').value.trim())||'';
  if(S.qEdit==='new'){d.id=uid();p.domande.push(d)}
  else{const i=p.domande.findIndex(x=>x.id===S.qEdit);p.domande[i]=d}
  S.qEdit=null;S.qDraft=null;saveDb();render();toast('Domanda salvata','check2-circle');
}
function moveQ(id,dir){
  const p=db.prodotti.find(x=>x.id===S.prodSel);
  const i=p.domande.findIndex(x=>x.id===id),j=i+dir;
  if(j<0||j>=p.domande.length)return;
  const t=p.domande[i];p.domande[i]=p.domande[j];p.domande[j]=t;saveDb();render();
}
function delQ(id){
  ask({title:'Elimina domanda',icon:'trash3',danger:true,msg:'Eliminare questa domanda dal questionario?',ok:'Elimina'})
  .then(ok=>{if(ok){const p=db.prodotti.find(x=>x.id===S.prodSel);p.domande=p.domande.filter(x=>x.id!==id);if(S.qEdit===id){S.qEdit=null;S.qDraft=null}saveDb();render()}});
}

/* — preset & github — */
function tSync(){
  const g=loadGh();
  const mopts=db.macro.map(m=>'<option value="'+m.id+'">'+esc(m.nome)+'</option>').join('');
  return '<div class="sync2"><div class="card pad"><h3 class="sec" style="margin-top:0"><i class="bi bi-save"></i> Backup ed export</h3>'
   +'<div class="verbox"><span class="mut">Versione preset attuale</span><b class="mono">'+esc(db.meta.versione||'—')+'</b></div>'
   +'<div class="btncol"><button class="btn btn-pr" onclick="exportAll()"><i class="bi bi-download"></i> Esporta tutto (CSV)</button>'
   +'<div class="addrow thin" style="margin:0;width:100%"><select class="inp" id="expMacro">'+mopts+'</select>'
   +'<button class="btn btn-gh" onclick="exportMacro()"><i class="bi bi-download"></i> Esporta categoria</button></div>'
   +'<label class="btn btn-gh filebtn"><i class="bi bi-upload"></i> Importa file CSV<input type="file" accept=".csv,text/csv" hidden onchange="onImportFile(this)"></label></div>'
   +'<p class="hint">L’export include operatori, categorie, prodotti e domande. Se all’import un prodotto ha già lo stesso codice, ti chiediamo quale conservare.</p>'
   +'<p class="hint lastbk"><i class="bi bi-clock-history"></i> Ultimo backup: <b>'+(db.meta.lastBackup?fmtTs(db.meta.lastBackup):'mai effettuato')+'</b>'
   +(db.meta.lastPush?' · Ultima pubblicazione GitHub: <b>'+fmtTs(db.meta.lastPush)+'</b>':'')+'</p></div>'
   +'<div class="card pad"><h3 class="sec" style="margin-top:0"><i class="bi bi-github"></i> GitHub · preset.csv</h3>'
   +'<p class="hint" style="margin-top:0">Metti <span class="mono">index.html</span> e <span class="mono">preset.csv</span> nella stessa cartella della repository: ogni PC legge i preset da solo all’avvio. Con “Pubblica”, il file su GitHub viene <b>sovrascritto</b> e il team riceve l’aggiornamento.</p>'
   +'<div class="ghgrid"><div class="frow"><label>Owner</label><input class="inp mono" id="ghOwner" value="'+esc(g.owner||'')+'" placeholder="utente-o-org"></div>'
   +'<div class="frow"><label>Repository</label><input class="inp mono" id="ghRepo" value="'+esc(g.repo||'')+'" placeholder="nome-repo"></div>'
   +'<div class="frow"><label>Branch</label><input class="inp mono" id="ghBranch" value="'+esc(g.branch||'main')+'"></div>'
   +'<div class="frow"><label>Percorso file</label><input class="inp mono" id="ghPath" value="'+esc(g.path||'preset.csv')+'"></div>'
   +'<div class="frow wide"><label>Token (fine-grained · Contents: Read and write)</label><input class="inp mono" type="password" id="ghToken" value="'+esc(g.token||'')+'" placeholder="github_pat_…"></div></div>'
   +'<div class="btncol row"><button class="btn btn-gh" onclick="saveGh()"><i class="bi bi-check-lg"></i> Salva configurazione</button>'
   +'<button class="btn btn-gh" onclick="ghPull(true)"><i class="bi bi-cloud-arrow-down"></i> Scarica da GitHub</button>'
   +'<button class="btn btn-pr" onclick="ghPushAsk()"><i class="bi bi-cloud-arrow-up"></i> Pubblica su GitHub</button></div>'
   +'<details class="ghhelp"><summary>Come creo il token?</summary><ol>'
   +'<li>Su GitHub: <b>Settings → Developer settings → Fine-grained tokens → Generate new token</b>.</li>'
   +'<li>Come “Repository access” seleziona <b>solo questa repository</b>.</li>'
   +'<li>Permessi: <b>Contents → Read and write</b>. Nient’altro.</li>'
   +'<li>Incolla il token qui sopra e salva. Viene memorizzato <b>solo in questo browser</b>.</li></ol></details></div></div>';
}
function ghPushAsk(){
  ask({title:'Pubblica su GitHub',icon:'cloud-arrow-up',msg:'Il file <span class="mono">preset.csv</span> nella repository verrà <b>sovrascritto</b> con la configurazione attuale e la versione sarà aggiornata con data e ora. Continuare?',ok:'Pubblica'})
  .then(ok=>{if(ok)ghPush()});
}

/* ════════ modal & toast ════════ */
let modalResolve=null;
function modalBox(html,wide){$('#modal').innerHTML='<div class="mcard'+(wide?' wide':'')+'">'+html+'</div>';$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML='';S.confl=null;const r=modalResolve;modalResolve=null;return r}
function mDone(v){const r=closeModal();if(r)r(v)}
function ask(o){
  return new Promise(res=>{modalResolve=res;modalBox(
    '<div class="mhead">'+(o.icon?'<i class="bi bi-'+o.icon+'"></i>':'')+esc(o.title)+'</div>'
    +'<p class="mmsg">'+o.msg+'</p><div class="macts"><button class="btn btn-gh" onclick="mDone(false)">Annulla</button>'
    +'<button class="btn '+(o.danger?'btn-dng':'btn-acc')+'" onclick="mDone(true)">'+esc(o.ok||'Conferma')+'</button></div>')});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on'))mDone(false)});

/* ════════ avvio ════════ */
window.addEventListener('DOMContentLoaded',async()=>{
  loadDb();
  const sop=sessionStorage.getItem('goc_op');
  if(sop&&db.operatori.find(o=>o.id===sop))S.op=sop;
  render();
  await ghPull(false);
});
</script>
</body>
